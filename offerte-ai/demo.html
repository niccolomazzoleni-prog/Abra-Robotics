<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Demo widget chat — Abra</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/offerte-ai.css">
  <style>
    .demo-page { min-height: calc(100vh - 56px); padding: 32px 24px; }
    .demo-hero { max-width: 640px; margin: 0 auto; text-align: center; }
    .demo-hero h1 { font-size: 1.75rem; letter-spacing: -0.03em; margin: 12px 0 8px; }
    .demo-hero p { color: var(--gray-600); margin: 0 0 24px; }
    .demo-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; max-width: 640px; margin: 0 auto; }
    .demo-card {
      background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius);
      padding: 16px; text-align: left; text-decoration: none; color: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .demo-card:hover { border-color: var(--accent); box-shadow: var(--shadow-sm); }
    .demo-card strong { display: block; font-size: 0.9rem; margin-bottom: 4px; }
    .demo-card span { font-size: 0.78rem; color: var(--gray-500); }
    .demo-widget-hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--black); color: var(--white); padding: 8px 16px;
      border-radius: 999px; font-size: 0.78rem; font-weight: 600;
      pointer-events: none; animation: fadeHint 4s ease forwards;
    }
    @keyframes fadeHint { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
  </style>
</head>
<body class="app-body">
  <div id="app-nav-mount"></div>
  <div class="demo-page">
    <div class="demo-hero">
      <span class="oai-badge">Widget embed</span>
      <h1>Come apparirà sul sito</h1>
      <p>Il pulsante chat in basso a destra è il widget embeddabile. Clicca per aprire l'assistente.</p>
    </div>
    <div class="demo-cards">
      <a class="demo-card" href="index.html"><strong>Chat full-page</strong><span>Layout split con sidebar</span></a>
      <a class="demo-card" href="offerta.html"><strong>Crea offerta</strong><span>Builder con anteprima live</span></a>
      <a class="demo-card" href="../admin/offerte-ai.html"><strong>Admin</strong><span>Config LLM e feedback</span></a>
    </div>
  </div>
  <div class="demo-widget-hint">↓ Prova il widget qui</div>
  <script src="js/app-shell.js"></script>
  <script>AbraUI.mountNav('demo');</script>
  <script src="js/widget.js" data-base="./" defer></script>
</body>
</html>
