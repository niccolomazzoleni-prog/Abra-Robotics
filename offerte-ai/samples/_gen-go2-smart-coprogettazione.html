<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genera preventivo Go2 + coprogettazione</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/offerte-ai.css">
</head>
<body class="offer-sample-body">
  <div class="offer-sample-toolbar" id="toolbar">
    <div><span class="badge">Pipeline offerte-ai</span> Generazione in corso…</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" onclick="window.print()">Stampa / PDF</button>
      <a href="../offerta.html">Editor offerte</a>
    </div>
  </div>
  <div class="offer-sample-wrap">
    <div class="offer-sample-paper" id="paper">Caricamento motore offerte…</div>
  </div>
  <script src="../js/quote-engine.js"></script>
  <script src="../js/offer-builder.js"></script>
  <script>
  (async function () {
    const params = new URLSearchParams(location.search);
    const ore = Math.max(1, parseInt(params.get('ore') || '85', 10) || 85);
    const servizioEur = parseFloat(params.get('servizio') || '8500') || 8500;
    const mesi = Math.max(1, parseInt(params.get('mesi') || '6', 10) || 6);

    const quote = new AbraQuoteEngine();
    await quote.load('../../listini/pubblico/end-user.json', '../data/offerte-regole.json');
    const builder = new AbraOfferBuilder(quote);
    await builder.load('../data/offerte-config.json', '../data/voci-extra.json', '../data/blocchi-ricorrenti.json');
    let manifest = {};
    try {
      manifest = await fetch('../../listini/pubblico/catalogo-manifest.json').then(r => r.json());
    } catch (_) {}
    builder.setProductManifest(manifest);

    const offer = builder.createEmpty({
      azienda: 'Cliente — da compilare',
      contatto: 'Referente — da compilare',
      email: '',
      piva: '',
    });
    offer.id = 'OFF-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-G2CP';
    offer.template_id = 'standard';
    offer.preventivo_formale = true;
    offer.note_iva = 'Prezzi IVA esclusa. Dazio doganale incluso nel robot. Listino competitivo IT (~DE +10%).';
    offer.intro =
      'Spett.le Cliente,\n\n' +
      'con la presente sottoponiamo **preventivo commerciale** per fornitura di **Unitree Go2 EDU** ' +
      'in **quattro configurazioni alternative** (Standard / Smart / Laser Mid-360 / Ultimate XT16) — ' +
      '**selezionarne una sola**, non cumulabili — unitamente a pacchetto di **coprogettazione / assistenza remota di ' + mesi + ' mesi** ' +
      '(monte ore **' + ore + ' h**, corrispettivo forfettario **€ ' + servizioEur.toLocaleString('it-IT', { minimumFractionDigits: 2 }) + '** IVA esclusa).\n\n' +
      'Configurazione consigliata: **Go2 EDU Smart** (Orin NX 100 TOPS).\n\n' +
      'I prezzi robot sono listino End-User Abra, IVA esclusa, allineati al mercato DE ' +
      '(riferimento quadruped.de / reichelt netto + ~10% distribuzione Italia, dazio incluso).\n\n' +
      'Le ore di servizio sono erogabili a **slot prenotabili** su disponibilità Abra, **sempre da remoto**, ' +
      'tra **sviluppo autonomo** e **sessioni di assistenza** (videocall / ticket).';
    offer.chiusura =
      'Restiamo a disposizione per call tecnico-commerciale e per la compilazione dei dati anagrafici del Cliente.\n\nCordiali saluti,\nAbra Robotics — Niccolò Mazzoleni';
    offer.prompt_extra =
      'Barrare una sola casella nella sezione «Accettazione del preventivo». ' +
      'Il monte ore (' + ore + ' h / ' + mesi + ' mesi) include sviluppo autonomo Abra e assistenza remota. ' +
      'Tariffa implicita pacchetto: € ' + (servizioEur / ore).toFixed(2).replace('.', ',') + '/h.';
    offer.condizioni =
      '**Condizioni specifiche di questo preventivo**\n' +
      '• Robot: scegliere una sola tra le quattro configurazioni Go2 (non cumulabili).\n' +
      '• Pacchetto coprogettazione: durata ' + mesi + ' mesi dalla conferma d\'ordine; monte ' + ore +
      ' ore; slot su disponibilità; erogazione esclusivamente remota (sviluppo autonomo + assistenza).\n' +
      '• Esclusi: trasferte on-site, ricambi hardware, sensori/accessori non elencati.\n' +
      '• Condizioni generali di vendita Abra Robotics applicabili ove non in contrasto con il presente preventivo.';

    // Quattro scelte separate (mutuamente esclusive)
    builder.addCatalogLine(offer, 'GO2-EDU-STD', 1, {
      opzione_robot: true,
      robot_gruppo: 'go2',
      alternativa: true,
    });
    builder.addCatalogLine(offer, 'GO2-EDU-SMART', 1, {
      opzione_robot: true,
      principale: true,
      robot_gruppo: 'go2',
    });
    builder.addCatalogLine(offer, 'GO2-EDU-LASER', 1, {
      opzione_robot: true,
      robot_gruppo: 'go2',
      alternativa: true,
    });
    builder.addCatalogLine(offer, 'GO2-EDU-ULT', 1, {
      opzione_robot: true,
      robot_gruppo: 'go2',
      alternativa: true,
    });

    const tariffa = servizioEur / ore;
    builder.addCustomLine(
      offer,
      'Coprogettazione e assistenza remota — pacchetto ' + mesi + ' mesi (' + ore + ' h)',
      servizioEur,
      1,
      'Monte ore ' + ore + ' h prenotabili a slot su disponibilità. ' +
        'Attività sempre da remoto: sviluppo autonomo Abra + sessioni di assistenza (videocall/ticket). ' +
        'Corrispettivo forfettario € ' + servizioEur.toLocaleString('it-IT', { minimumFractionDigits: 2 }) +
        ' (≈ € ' + tariffa.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '/h). ' +
        'Si applica alla configurazione robot selezionata.',
      'servizio'
    );

    builder.addBlock(offer, {
      type: 'section',
      title: 'Cosa differenzia le quattro configurazioni Go2 EDU',
      body:
        'Chassis, payload (~8 kg), velocità, batteria e SDK sono **comuni**. ' +
        'Cambia **compute onboard** e **LiDAR 3D aggiuntivo**.\n\n' +
        '**1) Go2 EDU Standard** — Orin **Nano 40 TOPS**. LiDAR 4D L2 + RealSense D435i. Nessun LiDAR 3D esterno. Lab / corsi / PoC.\n\n' +
        '**2) Go2 EDU Smart (EDU Plus) — consigliata** — Orin **NX 100 TOPS**. Stessi sensori della Standard, più compute per AI e integrazione.\n\n' +
        '**3) Go2 EDU Laser Smart (+ Livox Mid-360)** — Orin NX 100 TOPS + **Livox Mid-360**. SLAM / navigazione autonoma.\n\n' +
        '**4) Go2 EDU Ultimate (+ Hesai XT16)** — Orin NX 100 TOPS + **Hesai XT16**. Perception outdoor / R&S ad alta risoluzione.\n\n' +
        '**Confronto rapido**\n' +
        '• Compute: Std 40 TOPS · Smart/Laser/XT16 = 100 TOPS\n' +
        '• LiDAR onboard: tutte 4D L2\n' +
        '• LiDAR 3D extra: Laser → Mid-360 · Ultimate → XT16\n' +
        '• Camera: tutte RealSense D435i · SDK / ROS 2: sì',
    });
    builder.addProductSheetBlock(offer, 'GO2-EDU-STD', manifest);
    builder.addProductSheetBlock(offer, 'GO2-EDU-SMART', manifest);
    builder.addProductSheetBlock(offer, 'GO2-EDU-LASER', manifest);
    builder.addProductSheetBlock(offer, 'GO2-EDU-ULT', manifest);
    builder.addBlock(offer, {
      type: 'section',
      title: 'Come funziona il monte ore di coprogettazione',
      body:
        '• **Durata:** ' + mesi + ' mesi dalla conferma d\'ordine.\n' +
        '• **Monte ore:** ' + ore + ' ore totali, a **slot prenotabili** su disponibilità Abra.\n' +
        '• **Modalità:** esclusivamente **remota**.\n' +
        '• **Suddivisione:** sviluppo autonomo Abra + assistenza remota (videocall/ticket).\n' +
        '• **Fuori scope:** hardware aggiuntivo, ricambi, on-site, trasferte.',
    });
    builder.insertRecurringBlock(offer, 'perche-abra');
    builder.insertRecurringBlock(offer, 'consegna-supporto');

    const totals = builder.recalculate(offer);
    const body = builder.renderOfferDocument(offer);
    document.getElementById('paper').innerHTML = body;
    document.getElementById('toolbar').querySelector('div').innerHTML =
      '<span class="badge">Preventivo formale</span> ' +
      offer.id + ' · 4 scelte Go2 (1 sola) + XT16 + ' + ore + ' h · Totale consigliato <strong>€ ' +
      totals.subtotal.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</strong>';

    window.__OFFER__ = offer;
    window.__TOTALS__ = totals;
    window.__OFFER_HTML__ = body;
    document.documentElement.dataset.ready = '1';
  })().catch(err => {
    document.getElementById('paper').textContent = 'Errore: ' + err.message;
    console.error(err);
  });
  </script>
</body>
</html>
