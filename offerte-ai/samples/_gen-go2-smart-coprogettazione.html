<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genera offerta Go2 + coprogettazione</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/offerte-ai.css">
</head>
<body class="offer-sample-body">
  <div class="offer-sample-toolbar" id="toolbar">
    <div><span class="badge">Pipeline offerte-ai</span> Generazione in corso…</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" onclick="window.print()">Stampa / PDF</button>
      <a href="../offerta.html">Editor offerte</a>
    </div>
  </div>
  <div class="offer-sample-wrap">
    <div class="offer-sample-paper" id="paper">Caricamento motore offerte…</div>
  </div>
  <script src="../js/quote-engine.js"></script>
  <script src="../js/offer-builder.js"></script>
  <script>
  (async function () {
    const params = new URLSearchParams(location.search);
    const ore = Math.max(1, parseInt(params.get('ore') || '85', 10) || 85);
    const servizioEur = parseFloat(params.get('servizio') || '8500') || 8500;
    const mesi = Math.max(1, parseInt(params.get('mesi') || '6', 10) || 6);

    const quote = new AbraQuoteEngine();
    await quote.load('../../listini/pubblico/end-user.json', '../data/offerte-regole.json');
    const builder = new AbraOfferBuilder(quote);
    await builder.load('../data/offerte-config.json', '../data/voci-extra.json', '../data/blocchi-ricorrenti.json');
    let manifest = {};
    try {
      manifest = await fetch('../../listini/pubblico/catalogo-manifest.json').then(r => r.json());
    } catch (_) {}
    builder.setProductManifest(manifest);

    const offer = builder.createEmpty({
      azienda: 'Cliente — da compilare',
      contatto: 'Referente — da compilare',
      email: '',
    });
    offer.id = 'OFF-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-G2CP';
    offer.template_id = 'standard';
    offer.intro =
      'Gentile Cliente,\n\n' +
      'in riferimento alla Sua richiesta, sottoponiamo preventivo per **Unitree Go2 EDU** ' +
      'con tre **configurazioni robot alternative** (Standard / Smart / Laser Smart) — ' +
      '**selezionarne una sola**, non cumulabili — e un pacchetto di **coprogettazione / assistenza remota di ' + mesi + ' mesi** ' +
      '(monte ore **' + ore + ' h**, corrispettivo forfettario **€ ' + servizioEur.toLocaleString('it-IT', { minimumFractionDigits: 2 }) + '** IVA esclusa).\n\n' +
      'Configurazione consigliata: **Go2 EDU Smart** (Orin NX 100 TOPS).\n\n' +
      '**Prezzi robot:** listino End-User Abra, IVA esclusa, allineato al mercato DE ' +
      '(riferimento quadruped.de / reichelt netto + ~10% per distribuzione Italia, dazio incluso).\n\n' +
      'Le ore sono erogabili a **slot prenotabili** in base alle disponibilità del team Abra. ' +
      'L\'attività è **sempre da remoto** e si suddivide tra **sviluppo autonomo** Abra e **sessioni di assistenza** (videocall / ticket).';
    offer.chiusura =
      'Restiamo a disposizione per confermare la configurazione robot scelta e il calendario degli slot.\n\nCordiali saluti,\nAbra Robotics';
    offer.prompt_extra =
      'Robot in tabella: alternative non cumulabili — selezionare una sola configurazione Go2.\n' +
      'Modalità erogazione servizio: 100% remoto. Gli slot ore si prenotano su disponibilità. ' +
      'Il monte ore (' + ore + ' h in ' + mesi + ' mesi) include sia lo sviluppo autonomo lato Abra sia le sessioni di assistenza congiunta. ' +
      'Tariffa implicita pacchetto: € ' + (servizioEur / ore).toFixed(2).replace('.', ',') + '/h.';
    offer.condizioni =
      (builder.config?.condizioni_default || '') +
      '\n\nRobot: scegliere una sola tra le configurazioni Go2 quotate (non cumulabili).\n' +
      'Pacchetto coprogettazione: durata ' + mesi + ' mesi dalla conferma d\'ordine; monte ' + ore +
      ' ore totali; prenotazione slot in base a disponibilità; erogazione esclusivamente remota ' +
      '(sviluppo autonomo + assistenza). Non include trasferte on-site né ricambi hardware.';

    // Tre scelte separate (mutuamente esclusive) — qty 1 ciascuna, non si sommano
    builder.addCatalogLine(offer, 'GO2-EDU-STD', 1, {
      opzione_robot: true,
      robot_gruppo: 'go2',
      alternativa: true,
    });
    builder.addCatalogLine(offer, 'GO2-EDU-SMART', 1, {
      opzione_robot: true,
      principale: true,
      robot_gruppo: 'go2',
    });
    builder.addCatalogLine(offer, 'GO2-EDU-LASER', 1, {
      opzione_robot: true,
      robot_gruppo: 'go2',
      alternativa: true,
    });

    const tariffa = servizioEur / ore;
    builder.addCustomLine(
      offer,
      'Coprogettazione e assistenza remota — pacchetto ' + mesi + ' mesi (' + ore + ' h)',
      servizioEur,
      1,
      'Monte ore ' + ore + ' h prenotabili a slot su disponibilità. ' +
        'Attività sempre da remoto: sviluppo autonomo Abra + sessioni di assistenza (videocall/ticket). ' +
        'Corrispettivo forfettario € ' + servizioEur.toLocaleString('it-IT', { minimumFractionDigits: 2 }) +
        ' (≈ € ' + tariffa.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '/h). ' +
        'Si applica alla configurazione robot selezionata.',
      'servizio'
    );

    builder.addBlock(offer, {
      type: 'section',
      title: 'Cosa differenzia le tre configurazioni Go2 EDU',
      body:
        'Chassis, payload (~8 kg), velocità, batteria e SDK sono **comuni** a tutte e tre. ' +
        'Cambia solo **compute onboard** e **LiDAR 3D aggiuntivo**.\n\n' +
        '**1) Go2 EDU Standard** — Jetson **Orin Nano 40 TOPS**. ' +
        'LiDAR 4D L2 + RealSense D435i. Nessun LiDAR 3D esterno. ' +
        'Scelta per didattica, ROS 2, teleoperazione e PoC leggeri.\n\n' +
        '**2) Go2 EDU Smart (EDU Plus) — consigliata** — Jetson **Orin NX 100 TOPS**. ' +
        'Stessi sensori della Standard, ma 2,5× compute per AI, perception e integrazione software. ' +
        'Base corretta se prevedete braccio D1 o upgrade LiDAR futuri.\n\n' +
        '**3) Go2 EDU Laser Smart (+ Livox Mid-360)** — Orin NX **100 TOPS** + **LiDAR 3D Livox Mid-360** ' +
        'oltre al 4D L2. Per SLAM, mapping e navigazione autonoma in ambienti complessi.\n\n' +
        '**Confronto rapido**\n' +
        '• **Compute:** Standard = Orin Nano 40 TOPS · Smart = Orin NX 100 TOPS · Laser = Orin NX 100 TOPS\n' +
        '• **LiDAR onboard:** tutte 4D L2\n' +
        '• **LiDAR 3D extra:** solo Laser → Livox Mid-360\n' +
        '• **Camera depth:** tutte RealSense D435i\n' +
        '• **SDK / ROS 2:** tutte sì\n' +
        '• **Ideale per:** Standard → lab/corsi · Smart → AI + integrazione · Laser → SLAM / autonomy',
    });
    builder.addProductSheetBlock(offer, 'GO2-EDU-STD', manifest);
    builder.addProductSheetBlock(offer, 'GO2-EDU-SMART', manifest);
    builder.addProductSheetBlock(offer, 'GO2-EDU-LASER', manifest);
    builder.addBlock(offer, {
      type: 'section',
      title: 'Come funziona il monte ore di coprogettazione',
      body:
        '• **Durata:** ' + mesi + ' mesi dalla conferma d\'ordine.\n' +
        '• **Monte ore:** ' + ore + ' ore totali, consumabili a **slot prenotabili** in base alle disponibilità del team Abra.\n' +
        '• **Modalità:** esclusivamente **remota** (nessuna trasferta on-site inclusa).\n' +
        '• **Suddivisione attività:**\n' +
        '  – **Sviluppo autonomo** — lavoro tecnico Abra su integrazioni, configurazioni, software e deliverable di progetto;\n' +
        '  – **Assistenza remota** — sessioni con il cliente (videocall, ticket, diagnosi e supporto operativo).\n' +
        '• **Prenotazione:** gli slot si concordano con il referente Abra; l\'erogazione segue la disponibilità calendariale.\n' +
        '• **Fuori scope:** hardware aggiuntivo, ricambi, interventi on-site, trasferte (quotabili a parte).',
    });
    builder.insertRecurringBlock(offer, 'perche-abra');
    builder.insertRecurringBlock(offer, 'consegna-supporto');

    const totals = builder.recalculate(offer);
    const body = builder.renderOfferDocument(offer);
    document.getElementById('paper').innerHTML = body;
    document.getElementById('toolbar').querySelector('div').innerHTML =
      '<span class="badge">Pipeline offerte-ai</span> ' +
      offer.id + ' · 3 scelte Go2 (1 sola) + ' + ore + ' h / ' + mesi + ' mesi · Totale consigliato <strong>€ ' +
      totals.subtotal.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</strong>';

    window.__OFFER__ = offer;
    window.__TOTALS__ = totals;
    window.__OFFER_HTML__ = body;
    document.documentElement.dataset.ready = '1';
  })().catch(err => {
    document.getElementById('paper').textContent = 'Errore: ' + err.message;
    console.error(err);
  });
  </script>
</body>
</html>
