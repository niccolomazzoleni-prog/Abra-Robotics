<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Statistiche — Abra Robotics</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="auth.js"></script>
</head>
<body class="admin-page">
  <div class="admin-wrap admin-wrap--wide">
    <div id="admin-nav-mount"></div>

    <div class="admin-head admin-head--compact">
      <h1>Statistiche accessi</h1>
      <p>Beacon first-party → foglio Google <strong>Analytics</strong>. GA4 e Meta Pixel sono separati (link sotto).</p>
    </div>

    <div class="stats-toolbar">
      <div class="stats-period">
        <button type="button" class="btn btn-sm" data-stats-days="7">7 gg</button>
        <button type="button" class="btn btn-sm" data-stats-days="30">30 gg</button>
        <button type="button" class="btn btn-sm" data-stats-days="90">90 gg</button>
      </div>
      <button type="button" class="btn btn-primary btn-sm" id="btn-refresh">Aggiorna</button>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-export-pages">CSV pagine</button>
      <span class="stats-updated" id="stats-updated">…</span>
    </div>

    <p class="hint" id="setup-note" style="margin:0 0 12px"></p>

    <div class="quick-links quick-links--compact">
      <a href="https://analytics.google.com/" target="_blank" rel="noopener">GA4</a>
      <a href="https://docs.google.com/spreadsheets/d/1XpXE3odenRl9nlkR3Te_-RjNlOA-5PINxpI14uBdvnY/edit" target="_blank" rel="noopener">Foglio raw</a>
    </div>

    <div class="kpi-grid" id="kpi-grid"></div>

    <section class="admin-card admin-card--tight">
      <h2>Visite per giorno</h2>
      <div id="site-daily"></div>
    </section>

    <section class="admin-card admin-card--tight">
      <h2>Pagine più visitate</h2>
      <div id="site-pages"></div>
    </section>

    <section class="admin-card admin-card--tight">
      <h2>Referrer</h2>
      <div id="site-referrers"></div>
    </section>

    <section class="admin-card admin-card--tight">
      <h2>UTM</h2>
      <div id="site-utm"></div>
    </section>

    <details class="admin-fold">
      <summary>Infrastruttura GitHub (deploy, non traffico visitatori)</summary>
      <div id="github-panel" style="margin-top:12px"></div>
    </details>
  </div>
  <script src="../script.js"></script>
  <script src="admin-nav.js"></script>
  <script src="stats.js"></script>
  <script>AbraAdminNav.mount('stats');</script>
</body>
</html>
