<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Immagini AMR — Abra Robotics (interno)</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="auth.js"></script>
  <script src="github-publish.js"></script>
  <style>
    body { background: var(--gray-50); }
    .admin-wrap { padding: calc(40px + 48px) 48px 80px; }
    .admin-head { margin-bottom: 24px; }
    .admin-head h1 { font-size: 2rem; letter-spacing: -0.03em; margin: 8px 0; }
    .admin-head p { color: var(--gray-600); max-width: 820px; line-height: 1.55; }
    .admin-nav { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .admin-nav a { font-size: 0.88rem; font-weight: 700; color: var(--gray-600); text-decoration: none; }
    .admin-nav a:hover { color: var(--black); }
    .admin-toolbar {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      margin-bottom: 20px; padding: 16px 20px;
      background: rgba(255,255,255,0.7); backdrop-filter: blur(12px);
      border: 1px solid var(--gray-200); border-radius: var(--radius);
    }
    .admin-toolbar input, .admin-toolbar select {
      padding: 10px 14px; border: 1px solid var(--gray-200); border-radius: 8px;
      font-family: inherit; font-size: 0.9rem; background: var(--white);
    }
    .admin-toolbar input[type="search"] { min-width: 200px; flex: 1; }
    .img-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;
    }
    .img-card {
      background: rgba(255,255,255,0.8); backdrop-filter: blur(12px);
      border: 1px solid var(--gray-200); border-radius: var(--radius); overflow: hidden;
    }
    .img-card.changed { border-color: #f97316; box-shadow: 0 0 0 1px #f97316; }
    .img-preview {
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, #e8e8ec 0%, #d4d4d8 100%);
      display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid var(--gray-100); overflow: hidden;
    }
    .img-preview img, .img-preview video { max-width: 100%; max-height: 100%; object-fit: contain; padding: 12px; }
    .img-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
    .img-body .slug { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; color: var(--gray-500); }
    .img-body h3 { font-size: 0.95rem; margin: 0; letter-spacing: -0.02em; }
    .img-body input[type="text"] {
      width: 100%; padding: 8px 10px; border: 1px solid var(--gray-200); border-radius: 6px;
      font-size: 0.78rem; font-family: ui-monospace, monospace;
    }
    .img-body label.field { font-size: 0.72rem; font-weight: 700; color: var(--gray-500); margin-top: 4px; }
    .img-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .img-actions label, .img-actions button {
      font-size: 0.78rem; font-weight: 700; padding: 6px 10px; border-radius: 6px;
      border: 1px solid var(--gray-200); background: var(--white); cursor: pointer;
    }
    .img-actions input[type="file"] { display: none; }
    .status { font-size: 0.82rem; color: var(--gray-600); margin-top: 8px; }
    @media (max-width: 768px) { .admin-wrap { padding: 100px 20px 60px; } }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <nav class="admin-nav">
      <a href="index.html">← Admin</a>
      <a href="immagini.html">Immagini Unitree</a>
      <a href="../catalogo-amr.html" target="_blank">Catalogo AMR</a>
      <a href="../manifattura-logistica.html#amr" target="_blank">Manifattura AMR</a>
      <button type="button" class="btn btn-secondary btn-sm" style="margin-left:auto;" onclick="AbraAdmin.logout()">Esci</button>
    </nav>
    <div class="admin-head">
      <p class="label">Interno · Non indicizzato</p>
      <h1>Immagini catalogo AMR</h1>
      <p>16 modelli MiR, Youibot, Neura, AutoXing ed EP. Sostituisci foto o video, poi <strong>Pubblica sul sito live</strong>: catalogo AMR e sezione manifattura si aggiornano in 1–2 minuti (Ctrl+Shift+R).</p>
    </div>

    <div class="admin-toolbar">
      <input type="search" id="filter-search" placeholder="Cerca modello…" aria-label="Cerca">
      <select id="filter-group" aria-label="Categoria">
        <option value="">Tutte le categorie</option>
      </select>
      <button type="button" class="btn btn-primary btn-sm" id="btn-publish-live">Pubblica sul sito live</button>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-download-json">Scarica JSON</button>
    </div>

    <p class="status" id="token-status" style="margin-bottom:8px;"></p>
    <p class="status" id="status">Caricamento…</p>
    <div class="img-grid" id="grid"></div>
  </div>

  <script>
    const BASE = '../';
    const IMG_DIR = 'images/manifattura/amr/';
    let catalog = [];
    let overrides = {};
    let pendingFiles = {};

    function defaultFile(slug) {
      const item = catalog.find(c => c.slug === slug);
      const o = overrides[slug];
      if (o && o.file) return o.file;
      return item ? item.file : '';
    }

    function defaultVideo(slug) {
      const item = catalog.find(c => c.slug === slug);
      const o = overrides[slug];
      if (o && 'video' in o) return o.video || '';
      return (item && item.video) || '';
    }

    function markDirty(slug, card) {
      if (card) card.classList.add('changed');
    }

    async function loadData() {
      const [cRes, oRes] = await Promise.all([
        fetch(BASE + 'data/amr-catalog.json'),
        fetch(BASE + 'data/amr-images.json').catch(() => null)
      ]);
      catalog = await cRes.json();
      if (oRes && oRes.ok) overrides = await oRes.json();
      const groups = new Set(catalog.map(c => c.group));
      const sel = document.getElementById('filter-group');
      [...groups].sort().forEach(g => {
        const o = document.createElement('option');
        o.value = g; o.textContent = g;
        sel.appendChild(o);
      });
      render();
      document.getElementById('status').textContent =
        catalog.length + ' modelli AMR · ' + Object.keys(overrides).length + ' override';
      updateTokenStatus();
    }

    function filteredItems() {
      const q = document.getElementById('filter-search').value.toLowerCase();
      const grp = document.getElementById('filter-group').value;
      return catalog.filter(item => {
        if (grp && item.group !== grp) return false;
        if (q && !item.slug.includes(q) && !item.title.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      filteredItems().forEach(item => {
        const slug = item.slug;
        const filePath = (pendingFiles[slug] && pendingFiles[slug].path) || defaultFile(slug);
        const videoPath = defaultVideo(slug);
        const changed = !!pendingFiles[slug] || (overrides[slug] && overrides[slug]._dirty);
        const card = document.createElement('article');
        card.className = 'img-card' + (changed ? ' changed' : '');
        card.dataset.slug = slug;
        const previewSrc = pendingFiles[slug]
          ? pendingFiles[slug].preview
          : (filePath ? BASE + filePath : '');
        card.innerHTML = `
          <div class="img-preview">
            ${previewSrc ? `<img src="${previewSrc}" alt="${item.title}" onerror="this.style.opacity=0.2">` : '<span style="color:var(--gray-400);font-size:0.8rem">Nessuna immagine</span>'}
          </div>
          <div class="img-body">
            <span class="slug">${slug} · ${item.group}</span>
            <h3>${item.title}</h3>
            <label class="field">Immagine (PNG/WebP/JPG trasparente per MiR)</label>
            <input type="text" class="file-input" value="${filePath}" placeholder="${IMG_DIR}…">
            <label class="field">Video opzionale (solo basi MiR)</label>
            <input type="text" class="video-input" value="${videoPath}" placeholder="images/manifattura/amr/mir250-hero.mp4">
            <div class="img-actions">
              <label>Sostituisci foto<input type="file" accept="image/*" class="upload-input"></label>
              <label>Sostituisci video<input type="file" accept="video/mp4,video/webm" class="upload-video"></label>
              <button type="button" class="clear-video">Rimuovi video</button>
            </div>
          </div>`;
        const fileIn = card.querySelector('.file-input');
        const videoIn = card.querySelector('.video-input');
        fileIn.addEventListener('change', () => {
          overrides[slug] = { ...(overrides[slug] || {}), file: fileIn.value.trim(), _dirty: true };
          markDirty(slug, card);
        });
        videoIn.addEventListener('change', () => {
          overrides[slug] = { ...(overrides[slug] || {}), video: videoIn.value.trim(), _dirty: true };
          markDirty(slug, card);
        });
        card.querySelector('.upload-input').addEventListener('change', ev => {
          const file = ev.target.files[0];
          if (!file) return;
          const ext = file.name.split('.').pop().toLowerCase() || 'png';
          const newPath = `${IMG_DIR}${slug}.${ext}`;
          fileIn.value = newPath;
          const reader = new FileReader();
          reader.onload = () => {
            pendingFiles[slug] = { file, preview: reader.result, path: newPath, kind: 'image' };
            overrides[slug] = { ...(overrides[slug] || {}), file: newPath, _dirty: true };
            card.querySelector('.img-preview').innerHTML = `<img src="${reader.result}" alt="${item.title}">`;
            markDirty(slug, card);
          };
          reader.readAsDataURL(file);
        });
        card.querySelector('.upload-video').addEventListener('change', ev => {
          const file = ev.target.files[0];
          if (!file) return;
          const ext = file.name.split('.').pop().toLowerCase() || 'mp4';
          const newPath = `${IMG_DIR}${slug}-hero.${ext}`;
          videoIn.value = newPath;
          const key = slug + '-video';
          pendingFiles[key] = { file, path: newPath, kind: 'video', slug };
          overrides[slug] = { ...(overrides[slug] || {}), video: newPath, _dirty: true };
          markDirty(slug, card);
        });
        card.querySelector('.clear-video').addEventListener('click', () => {
          videoIn.value = '';
          overrides[slug] = { ...(overrides[slug] || {}), video: '', _dirty: true };
          delete pendingFiles[slug + '-video'];
          markDirty(slug, card);
        });
        grid.appendChild(card);
      });
    }

    function changedSlugs() {
      const slugs = new Set();
      document.querySelectorAll('.img-card.changed').forEach(c => slugs.add(c.dataset.slug));
      return slugs;
    }

    function collectUploads() {
      return Object.values(pendingFiles).map(pf => ({
        slug: pf.slug || Object.keys(pendingFiles).find(k => pendingFiles[k] === pf) || 'amr',
        path: pf.path,
        file: pf.file
      }));
    }

    function buildJson() {
      const out = {};
      changedSlugs().forEach(slug => {
        const card = document.querySelector(`.img-card[data-slug="${slug}"]`);
        if (!card) return;
        const file = card.querySelector('.file-input').value.trim();
        const video = card.querySelector('.video-input').value.trim();
        out[slug] = { file };
        if (video) out[slug].video = video;
        else if (overrides[slug] && 'video' in overrides[slug]) out[slug].video = '';
      });
      Object.keys(overrides).forEach(slug => {
        if (out[slug]) return;
        const o = { ...overrides[slug] };
        delete o._dirty;
        if (Object.keys(o).length) out[slug] = o;
      });
      return out;
    }

    function updateTokenStatus() {
      const el = document.getElementById('token-status');
      if (!el || !window.AbraAdmin) return;
      const ok = !!window.AbraAdmin.getGithubToken();
      el.textContent = ok
        ? 'Token GitHub attivo — puoi pubblicare.'
        : 'Token GitHub non in sessione — te lo chiederemo al publish.';
      el.style.color = ok ? 'var(--gray-600)' : '#b45309';
    }

    async function ensureGithubToken() {
      if (window.AbraAdmin && window.AbraAdmin.getGithubToken()) return true;
      const t = prompt('Incolla il Personal Access Token GitHub:');
      if (t && t.trim()) {
        window.AbraAdmin.setGithubToken(t.trim());
        updateTokenStatus();
        return true;
      }
      return false;
    }

    async function publishLive() {
      const n = changedSlugs().size;
      if (!n) {
        alert('Nessuna modifica. Carica un file o cambia un percorso (card arancione).');
        return;
      }
      if (!(await ensureGithubToken())) return;
      const btn = document.getElementById('btn-publish-live');
      btn.disabled = true;
      const status = document.getElementById('status');
      try {
        const json = buildJson();
        await AbraGithub.publishAmrLive({
          jsonObject: json,
          allUploads: collectUploads(),
          onProgress: msg => { status.textContent = msg; }
        });
        overrides = { ...overrides, ...json };
        Object.keys(overrides).forEach(k => delete overrides[k]._dirty);
        pendingFiles = {};
        status.textContent = `Pubblicato (${n} modelli). Catalogo AMR aggiornato in 1–2 min.`;
        render();
      } catch (err) {
        status.textContent = 'Errore: ' + (err.message || err);
        alert(status.textContent);
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('filter-search').addEventListener('input', render);
    document.getElementById('filter-group').addEventListener('change', render);
    document.getElementById('btn-publish-live').addEventListener('click', publishLive);
    document.getElementById('btn-download-json').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(buildJson(), null, 2) + '\n'], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'amr-images.json';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    AbraAdmin.requireLogin().then(loadData);
  </script>
</body>
</html>
