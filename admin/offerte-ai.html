<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Offerte AI — Admin Abra</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="auth.js"></script>
</head>
<body class="admin-page">
  <div class="admin-wrap">
    <div id="admin-nav-mount"></div>

    <div class="admin-head admin-head--compact">
      <h1>Offerte AI</h1>
      <p>Config LLM (solo localStorage). Training e feedback → <a href="../offerte-ai/index.html">Lab</a>.</p>
    </div>

    <div class="admin-quick-row">
      <a class="btn btn-primary btn-sm" href="../offerte-ai/index.html">Lab Training</a>
      <a class="btn btn-sm" href="../offerte-ai/offerta.html">Crea offerta PDF</a>
      <a class="btn btn-sm" href="knowledge.html">Knowledge RAG</a>
    </div>

    <section class="admin-card admin-card--tight">
      <h2>Provider LLM</h2>
      <label for="cfg-mode">Modalità</label>
      <select id="cfg-mode" class="admin-input">
        <option value="openai">OpenAI — gpt-5.4-mini (consigliato)</option>
        <option value="offline">Offline — solo RAG + listini</option>
        <option value="ollama">Ollama locale</option>
        <option value="google">Google AI Studio</option>
        <option value="deepseek">DeepSeek API</option>
        <option value="proxy">Proxy Ollama</option>
      </select>

      <div id="block-openai" class="llm-block">
        <label for="cfg-openai-key">API Key OpenAI</label>
        <input id="cfg-openai-key" type="password" class="admin-input" placeholder="sk-proj-…" autocomplete="off">
        <label for="cfg-openai-model">Modello</label>
        <select id="cfg-openai-model" class="admin-input">
          <option value="gpt-5.4-mini">gpt-5.4-mini</option>
          <option value="gpt-4.1-mini">gpt-4.1-mini</option>
          <option value="gpt-5.5">gpt-5.5</option>
        </select>
      </div>

      <div id="block-ollama" class="llm-block" hidden>
        <label for="cfg-ollama-url">URL Ollama</label>
        <input id="cfg-ollama-url" type="url" class="admin-input" placeholder="http://127.0.0.1:11434">
        <label for="cfg-ollama-model">Modello</label>
        <input id="cfg-ollama-model" type="text" class="admin-input" placeholder="gemma4:e4b">
      </div>

      <div id="block-deepseek" class="llm-block" hidden>
        <label for="cfg-deepseek-key">API Key DeepSeek</label>
        <input id="cfg-deepseek-key" type="password" class="admin-input" placeholder="sk-…">
        <select id="cfg-deepseek-model" class="admin-input">
          <option value="deepseek-chat">deepseek-chat</option>
          <option value="deepseek-reasoner">deepseek-reasoner</option>
        </select>
      </div>

      <div id="block-google" class="llm-block" hidden>
        <label for="cfg-google-key">API Key Google</label>
        <input id="cfg-google-key" type="password" class="admin-input" placeholder="AIza…">
        <input id="cfg-google-model" type="text" class="admin-input" value="gemma-3-4b-it">
      </div>

      <div id="block-proxy" class="llm-block" hidden>
        <label for="cfg-proxy-url">URL proxy</label>
        <input id="cfg-proxy-url" type="url" class="admin-input">
        <label for="cfg-proxy-key">Chiave X-Abra-Key</label>
        <input id="cfg-proxy-key" type="password" class="admin-input">
      </div>

      <div class="admin-actions">
        <button type="button" class="btn btn-primary btn-sm" id="btn-save">Salva</button>
        <button type="button" class="btn btn-sm" id="btn-test">Test</button>
      </div>
      <div id="test-result" class="test-result" hidden></div>
    </section>

    <details class="admin-fold">
      <summary>Cronologia offerte (browser)</summary>
      <div id="offer-history-admin" style="margin-top:10px"></div>
    </details>
  </div>

  <script src="../offerte-ai/js/app-shell.js"></script>
  <script src="../offerte-ai/js/prompt-guard.js"></script>
  <script src="../offerte-ai/js/kb-search.js"></script>
  <script src="../offerte-ai/js/llm-providers.js"></script>
  <script src="../offerte-ai/js/offer-history.js"></script>
  <script src="admin-nav.js"></script>
  <script>
    AbraAdminNav.mount('offerte');
    if (window.AbraOfferHistory) {
      AbraOfferHistory.renderList(document.getElementById('offer-history-admin'));
    }

    const modeEl = document.getElementById('cfg-mode');
    const blocks = {
      ollama: document.getElementById('block-ollama'),
      google: document.getElementById('block-google'),
      openai: document.getElementById('block-openai'),
      deepseek: document.getElementById('block-deepseek'),
      proxy: document.getElementById('block-proxy'),
    };

    function showBlocks() {
      const m = modeEl.value;
      blocks.ollama.hidden = !(m === 'ollama' || m === 'proxy');
      blocks.google.hidden = m !== 'google';
      blocks.openai.hidden = m !== 'openai';
      blocks.deepseek.hidden = m !== 'deepseek';
      blocks.proxy.hidden = m !== 'proxy';
    }

    function loadForm() {
      const c = AbraLLM.loadConfig();
      modeEl.value = c.mode === 'offline' && c.openaiApiKey ? 'openai' : c.mode;
      document.getElementById('cfg-ollama-url').value = c.ollamaUrl || '';
      document.getElementById('cfg-ollama-model').value = c.ollamaModel || '';
      document.getElementById('cfg-google-key').value = c.googleApiKey || '';
      document.getElementById('cfg-google-model').value = c.googleModel || 'gemma-3-4b-it';
      document.getElementById('cfg-openai-key').value = c.openaiApiKey || '';
      document.getElementById('cfg-openai-model').value = c.openaiModel || 'gpt-5.4-mini';
      document.getElementById('cfg-deepseek-key').value = c.deepseekApiKey || '';
      document.getElementById('cfg-deepseek-model').value = c.deepseekModel || 'deepseek-chat';
      document.getElementById('cfg-proxy-url').value = c.proxyUrl || '';
      document.getElementById('cfg-proxy-key').value = c.proxyKey || '';
      showBlocks();
    }

    modeEl.addEventListener('change', showBlocks);

    function collectConfig() {
      const openaiKey = document.getElementById('cfg-openai-key').value.trim();
      let mode = modeEl.value;
      if (openaiKey && mode === 'offline') mode = 'openai';
      return {
        mode,
        ollamaUrl: document.getElementById('cfg-ollama-url').value.trim(),
        ollamaModel: document.getElementById('cfg-ollama-model').value.trim(),
        googleApiKey: document.getElementById('cfg-google-key').value.trim(),
        googleModel: document.getElementById('cfg-google-model').value.trim(),
        openaiApiKey: openaiKey,
        openaiModel: document.getElementById('cfg-openai-model').value,
        deepseekApiKey: document.getElementById('cfg-deepseek-key').value.trim(),
        deepseekModel: document.getElementById('cfg-deepseek-model').value,
        proxyUrl: document.getElementById('cfg-proxy-url').value.trim(),
        proxyKey: document.getElementById('cfg-proxy-key').value.trim(),
      };
    }

    document.getElementById('btn-save').addEventListener('click', () => {
      const cfg = collectConfig();
      AbraLLM.saveConfig(cfg);
      AbraUI.toast('Salvato · ' + cfg.mode, 'ok');
    });

    document.getElementById('btn-test').addEventListener('click', async () => {
      const el = document.getElementById('test-result');
      el.hidden = false;
      el.textContent = 'Test…';
      el.className = 'test-result';
      const cfg = collectConfig();
      AbraLLM.saveConfig(cfg);
      const r = await AbraLLM.testConnection({});
      el.className = 'test-result ' + (r.ok ? 'test-ok' : 'test-err');
      el.textContent = r.ok ? ('OK — ' + r.preview) : r.error;
    });

    loadForm();
  </script>
</body>
</html>
