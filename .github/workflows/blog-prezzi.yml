name: Prezzi del blog allineati alle schede

# Quando cambia una scheda prodotto, i prezzi citati negli articoli
# (<a class="prezzo" data-prodotto="...">) vengono riscritti con il prezzo attuale.
on:
  push:
    branches: [main]
    paths:
      - 'prodotti/**'
      - 'blog/**'
      - '*/blog/**'
      - 'scripts/aggiorna_prezzi_blog.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prezzi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aggiorna i prezzi negli articoli
        run: python scripts/aggiorna_prezzi_blog.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/ '*/blog/'
          git diff --staged --quiet && exit 0
          git commit -m "chore: prezzi del blog allineati alle schede prodotto [skip ci]"
          for i in 1 2 3; do git push && break; git pull --rebase origin main; done
