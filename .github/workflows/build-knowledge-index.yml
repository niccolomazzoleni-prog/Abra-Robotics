name: Build knowledge index (offerte-ai)

on:
  push:
    branches: [main]
    paths:
      - 'listini/**'
      - 'offerte-ai/data/**'
      - 'data/amr-products.json'
      - 'scripts/build_knowledge_index.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Genera knowledge-index.json
        run: python scripts/build_knowledge_index.py
      - name: Commit indice se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offerte-ai/data/knowledge-index.json
          git diff --staged --quiet || git commit -m "chore(offerte-ai): rigenera knowledge index"
          git push
