name: Rigenera catalogo dopo immagini

on:
  push:
    branches: [main]
    paths:
      - 'data/product-images.json'
      - 'data/amr-images.json'
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Applica override immagini e rigenera HTML
        run: python scripts/regenerate_from_public.py

      - name: Garantisci GA4 su tutte le pagine
        run: python scripts/ensure_tracking.py

      - name: Immagini WebP (le pagine rigenerate tornano alle versioni leggere)
        run: |
          pip install --quiet pillow
          python scripts/immagini_webp.py

      - name: Commit aggiornamenti sito
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ prodotti/_template*.html catalogo-unitree.html catalogo-amr.html merchant-feed.xml sitemap.xml listino-unitree.html listini/pubblico/ prodotti/ quadrupedi.html index.html universita-ricerca.html manifattura-logistica.html data/amr-catalog.json data/amr-products.json data/product-images.json scripts/image-runtime.js
          git diff --staged --quiet || git commit -m "chore: rigenera catalogo dopo aggiornamento immagini"
          # il job del feed puo' aver pubblicato nello stesso momento: riallinea e riprova
          for i in 1 2 3; do git push && break; git pull --rebase -X theirs origin main || git pull --rebase origin main; done
