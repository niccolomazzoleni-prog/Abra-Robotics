name: Sync Availability

on:
  schedule:
    - cron: '0 8 * * *'   # ogni giorno alle 8:00 UTC
  workflow_dispatch:        # avvio manuale da GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests beautifulsoup4

      - name: Scrape quadruped.de
        run: python prodotti/_sync_availability.py

      - name: Rigenera merchant feed con disponibilita aggiornata
        run: cd prodotti && python _gen_merchant_feed.py

      - name: Commit if changed
        run: |
          git config user.name "availability-bot"
          git config user.email "bot@abra-robotics.it"
          git add availability.json merchant-feed.xml
          git diff --staged --quiet || (
            git commit -m "chore: sync availability + rigenera feed [skip ci]" &&
            git push
          )
