  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 44px; }

  svg.logo path, svg.logo rect, svg.logo circle { fill: var(--inchiostro); transform-box: fill-box; }
  .sale { animation: sale 1s cubic-bezier(.3,0,.2,1) both; }
  .punto { transform-origin: center; animation: p .45s cubic-bezier(.2,1.4,.4,1) both; }
  .filo { transform-origin: left center; animation: h .5s cubic-bezier(.6,0,.2,1) both; }
  .scrivi { animation: c .45s ease both; }
  .sotto { font-family: var(--mono); font-size: 14px; color: var(--grafite); letter-spacing: .06em; animation: c .5s ease 2.5s both; }
  button { font: 13px var(--mono); background: none; border: 1px solid var(--inchiostro); padding: 6px 12px; cursor: pointer; color: var(--inchiostro); }
  @keyframes sale { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes p { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes h { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes c { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0s !important; animation-delay: 0s !important; } }
</style>
