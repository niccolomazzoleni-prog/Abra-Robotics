<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Abra Robotics, logo animato</title>
<link rel="stylesheet" href="../abra-c.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 40px; }
  svg.logo { width: min(78vw, 980px); overflow: visible; }
  .corpoA { animation: sale 0.9s cubic-bezier(.3,0,.2,1) both; }
  .punto { transform-box: fill-box; transform-origin: center; animation: punto 0.45s cubic-bezier(.2,1.4,.4,1) 0.9s both; }
  .filo { transform-box: fill-box; transform-origin: left center; animation: filo 0.55s cubic-bezier(.6,0,.2,1) 1.25s both; }
  .resto { animation: scrivi 1.0s steps(12, end) 1.75s both; }
  .sotto { font-family: var(--mono); font-size: 14px; color: var(--grafite); letter-spacing: .06em; opacity: 0; animation: compare .5s ease 2.9s both; }
  .sotto::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--evidenziatore); box-shadow: 0 0 0 1.5px var(--inchiostro); margin-right: 10px; vertical-align: 0; }
  button { font: 13px var(--mono); background: none; border: 1px solid var(--inchiostro); padding: 6px 12px; cursor: pointer; color: var(--inchiostro); }
  @keyframes sale { from { clip-path: inset(100% 0 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes punto { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes filo { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes scrivi { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes compare { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0s !important; animation-delay: 0s !important; } }
</style>
