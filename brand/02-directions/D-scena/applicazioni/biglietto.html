<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<title>Biglietto da visita 85 x 55 mm, fronte e retro</title>
<link rel="stylesheet" href="../sistema.css">
<style>
/* scala: 12 px = 1 mm, biglietto 1020 x 660 px; corpo minimo 26 px = 6,2 pt */
body{margin:0;background:#CFCEC8;font-family:var(--f)}
.tavolo{width:2240px;height:860px;display:flex;gap:80px;align-items:center;justify-content:center}
.bv{position:relative;width:1020px;height:660px;overflow:hidden;background:var(--carta);color:var(--grafite);box-shadow:0 2px 0 rgba(32,33,36,.15),0 18px 40px rgba(32,33,36,.2)}
.fronte img{position:absolute;left:84px;top:250px;width:560px}
.fronte .riga{position:absolute;left:84px;bottom:72px;font-size:26px;color:var(--fumo)}
.fronte .filo{position:absolute;left:0;right:0;bottom:0;height:24px;background:var(--magenta)}
.retro{padding:72px 84px}
.retro .nome{margin:0;font-size:68px}
.retro .ruolo{margin:14px 0 0;font-size:28px;line-height:1.35;color:var(--fumo)}
.retro .contatti{position:absolute;left:84px;bottom:68px;font-size:28px;line-height:1.55;margin:0}
.retro .simbolo{position:absolute;right:84px;bottom:76px;height:96px}
</style></head>
<body>
<div class="tavolo">
  <div class="bv fronte">
    <img src="../logo/orizzontale.svg" alt="abra Robotics">
    <p class="txt riga">Robotica applicata per aziende, laboratori ed eventi</p>
    <div class="filo"></div>
  </div>
  <div class="bv retro">
    <h1 class="titolo nome">Niccolò Mazzoleni</h1>
    <p class="ruolo txt">Cofondatore, commerciale e strategia</p>
    <p class="contatti txt">nico@abrarobotics.com<br>+39 3XX XXX XXXX<br>abrarobotics.com</p>
    <img class="simbolo" src="../logo/simbolo.svg" alt="">
  </div>
</div>
</body></html>
