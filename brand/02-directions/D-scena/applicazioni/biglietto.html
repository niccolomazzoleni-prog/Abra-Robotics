<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<title>Biglietto da visita 85 x 55 mm, fronte e retro</title>
<link rel="stylesheet" href="../sistema.css">
<style>
/* scala: 12 px = 1 mm, biglietto 1020 x 660 px */
body{margin:0;background:#CFC6B8;font-family:var(--f)}
.tavolo{width:2240px;height:860px;display:flex;gap:80px;align-items:center;justify-content:center}
.bv{position:relative;width:1020px;height:660px;overflow:hidden;box-shadow:0 2px 0 rgba(33,20,18,.18),0 18px 40px rgba(33,20,18,.22)}
.fronte{background:var(--velluto)}
.fronte .fondale{position:absolute;left:360px;top:0;width:520px;height:440px;background:var(--quinta);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.fronte img{position:absolute;left:72px;top:72px;height:64px}
.fronte .palco{left:0;width:1020px;top:440px;height:220px;--p-top-l:8%;--p-top-r:8%}
.fronte .segno-a{position:absolute;left:475px;top:458px;width:70px;height:11px;background:var(--velluto)}
.fronte .segno-a::after{content:"";position:absolute;left:29px;top:0;width:12px;height:26px;background:var(--velluto)}
.fronte .riga{position:absolute;left:0;right:0;text-align:center;bottom:70px;color:var(--velluto);font-size:17px}
.retro{background:var(--carta);color:var(--velluto);padding:72px}
.retro .nome{margin:0;font-size:92px}
.retro .ruolo{margin:14px 0 0;font-size:25px;line-height:1.35}
.retro .contatti{position:absolute;left:72px;bottom:66px;font-size:24px;line-height:1.55}
.retro .contatti span{color:var(--fumo)}
.retro .simbolo{position:absolute;right:72px;bottom:72px;height:120px}
.retro .lbl{position:absolute;right:72px;top:78px;font-size:15px;color:var(--fumo)}
.didasc{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:20px;color:var(--velluto)}
</style></head>
<body>
<div class="tavolo">
  <div class="bv fronte">
    <div class="fondale"></div>
    <img src="../logo/orizzontale-negativo.svg" alt="Abra Robotics">
    <div class="palco"></div>
    <div class="segno-a"></div>
    <p class="lbl riga">Robotica applicata · aziende, laboratori, eventi</p>
  </div>
  <div class="bv retro">
    <p class="lbl">abrarobotics.com</p>
    <h1 class="disp nome">Niccolò<br>Mazzoleni</h1>
    <p class="ruolo txt">Cofondatore, commerciale e strategia</p>
    <p class="contatti txt"><span>Mail</span> nico@abrarobotics.com<br><span>Telefono</span> +39 3XX XXX XXXX</p>
    <img class="simbolo" src="../logo/simbolo.svg" alt="">
  </div>
</div>
</body></html>
