<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Abra, prova del marchio v2</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="../sistema.css">
<style>
body{margin:0;background:var(--cemento);color:var(--grafite);font-family:var(--f)}
.wrap{padding:48px 56px;display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
h1{grid-column:1/-1;margin:0;font-size:56px}
.box{background:var(--carta);padding:24px}
.box .lbl{margin:0 0 16px;color:var(--fumo)}
.tab{display:flex;align-items:center;gap:8px;background:#D4D3CE;border-radius:8px 8px 0 0;padding:8px 14px;width:280px;font-size:13px;font-weight:600}
.tab img{width:16px;height:16px;image-rendering:pixelated}
.bar{background:#fff;height:10px;border-radius:0 0 4px 4px}
.row{display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap}
.row figure{margin:0;text-align:center;font-size:11px;color:var(--fumo)}
.row figcaption{margin-top:8px}
.px{image-rendering:pixelated}
.c{border-radius:50%;overflow:hidden;display:block}
.s{border-radius:14px;overflow:hidden;display:block}
.vers{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.vers div{height:220px;display:grid;place-items:center;background:var(--carta)}
.vers .g{background:var(--grafite)}.vers .m{background:var(--magenta)}
.vers img{max-width:78%;max-height:120px}
.big{grid-column:1/-1;height:480px;background:var(--magenta);display:grid;place-items:center}
.big img{width:80%}
</style></head>
<body><div class="wrap">
<h1 class="titolo">Prova del marchio, v2</h1>
<div class="box" style="grid-column:span 5">
  <p class="lbl">Favicon 16 px nella scheda del browser</p>
  <div class="tab"><img src="favicon-16.png" alt="">abra Robotics, robotica applicata</div><div class="bar"></div>
  <p class="lbl" style="margin-top:26px">Favicon disegnata a pixel, 16 e 32 px e ingrandita 6 volte</p>
  <div class="row">
    <figure><img class="px" src="favicon-16.png" width="16" height="16" alt=""><figcaption>16</figcaption></figure>
    <figure><img class="px" src="favicon-32.png" width="32" height="32" alt=""><figcaption>32</figcaption></figure>
    <figure><img class="px" src="favicon-16-x6.png" width="96" height="96" alt=""><figcaption>16 x 6</figcaption></figure>
    <figure><img src="simbolo.svg" height="16" alt=""><figcaption>simbolo 16 mono</figcaption></figure>
    <figure><img src="simbolo.svg" height="32" alt=""><figcaption>32 mono</figcaption></figure>
  </div>
</div>
<div class="box" style="grid-column:span 7">
  <p class="lbl">Avatar social, cerchio e quadrato</p>
  <div class="row">
    <img class="c" src="monogramma.svg" width="160" height="160" alt="Avatar circolare">
    <img class="s" src="monogramma.svg" width="160" height="160" alt="Avatar quadrato">
    <img class="c" src="monogramma.svg" width="64" height="64" alt="">
    <img class="c" src="monogramma.svg" width="40" height="40" alt="">
    <img class="c" src="monogramma.svg" width="24" height="24" alt="">
  </div>
</div>
<div class="vers">
  <div><img src="orizzontale.svg" alt="Orizzontale"></div>
  <div class="g"><img src="orizzontale-negativo.svg" alt="Orizzontale negativo"></div>
  <div class="m"><img src="mono-negativo.svg" alt="Monocromo su magenta"></div>
  <div><img src="verticale.svg" alt="Verticale"></div>
  <div><img src="mono-positivo.svg" alt="Monocromo positivo"></div>
  <div><img src="simbolo.svg" alt="Simbolo ab"></div>
</div>
<div class="big"><img src="logotipo-negativo.svg" alt="Logotipo grande formato"></div>
</div></body></html>
