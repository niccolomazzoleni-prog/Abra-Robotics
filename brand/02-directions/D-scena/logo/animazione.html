<title>Abra, logo animato: la luce si accende</title>
<link rel="icon" href="monogramma.svg">
<link rel="stylesheet" href="../sistema.css">
<style>
body{margin:0;background:var(--velluto);color:var(--stucco);font-family:var(--f);overflow:hidden}
.palcoscenico{position:relative;width:100vw;height:100vh;min-height:420px;overflow:hidden;background:var(--velluto)}
.fascio{position:absolute;left:25%;top:0;width:50%;height:100%;background:var(--quinta);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);opacity:0;animation:fascio .9s .1s cubic-bezier(.3,0,.2,1) forwards}
svg{position:absolute;left:13%;top:42%;width:74%;overflow:visible}
#pavimento{fill:#4A1A0C;opacity:0;animation:dimmer .9s .35s cubic-bezier(.45,0,.2,1) forwards}
#a{transform:translateY(760px);animation:entrata .8s .75s cubic-bezier(.2,.8,.2,1) forwards}
#bra{clip-path:inset(0 100% 0 0);animation:apertura .7s 1.35s cubic-bezier(.6,0,.2,1) forwards}
#rob{opacity:0;transform:translateY(60px);animation:sale .6s 1.9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fascio{to{opacity:1}}
/* la luce di tungsteno, salendo col dimmer, passa dal rosso al giallo caldo */
@keyframes dimmer{0%{opacity:0;fill:#4A1A0C}35%{opacity:1;fill:#8E3A14}70%{fill:#D58C2F}100%{opacity:1;fill:#E9AE45}}
@keyframes entrata{to{transform:translateY(0)}}
@keyframes apertura{to{clip-path:inset(0 0 0 0)}}
@keyframes sale{to{opacity:1;transform:translateY(0)}}
.cue{position:absolute;left:40px;bottom:32px;font-size:12px;color:var(--fumo-chiaro)}
button{position:absolute;right:40px;bottom:26px;background:none;border:1.5px solid var(--stucco);color:var(--stucco);font:600 13px var(--f);padding:9px 14px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.fascio,#pavimento,#a,#bra,#rob{animation-duration:.01s;animation-delay:0s}}
</style></head>
