<!doctype html>
<html lang="it">
<head>

<title>Abra Robotics, biglietto da visita 85 x 55 mm (direzione Cartamodello)</title>
<link rel="stylesheet" href="../assets/sistema.css">
<style>
  /* scala di lavoro: 12 px = 1 mm. Biglietto 85 x 55 mm = 1020 x 660 px */
  body{width:1440px;height:900px;overflow:hidden;position:relative;background:#E2DACA}
  .lato{position:absolute;width:1020px;height:660px;box-shadow:0 2px 0 rgba(47,51,55,.08),0 30px 60px -30px rgba(47,51,55,.45);overflow:hidden}
  .f{left:60px;top:240px;transform:scale(.62);transform-origin:0 0}
  .r{left:752px;top:240px;background:var(--tela);transform:scale(.62);transform-origin:0 0}
  .fronte{position:absolute;inset:0;width:100%;height:100%}
  .nome{position:absolute;left:72px;top:70px}
  .nome h2{font-size:58px;font-weight:700;font-stretch:86%;letter-spacing:-0.01em;font-variation-settings:"opsz" 60}
  .nome p{font-size:24px;margin-top:8px;color:var(--grafite)}
  .contatti{position:absolute;left:72px;top:300px;font-size:24px;line-height:1.55}
  .contatti span{display:inline-block;width:52px;font-weight:600;font-stretch:75%;letter-spacing:.08em;font-size:15px;color:var(--grafite);text-transform:uppercase}
  .r img.logo{position:absolute;right:72px;top:438px;height:46px}
  .r .metro-b{position:absolute;left:0;bottom:0}
  .nota{position:absolute;left:60px;top:700px;width:900px;line-height:1.5;font-size:12px;color:var(--grafite)}
</style>
</head>
<body>
<div class="t-etichetta" style="position:absolute;left:60px;top:190px;font-size:13px;color:var(--grafite)">Fronte</div><div class="t-etichetta" style="position:absolute;left:752px;top:190px;font-size:13px;color:var(--grafite)">Retro</div>
<div class="lato f"><svg class="fronte" viewBox="-1106 -478 2900 1876" preserveAspectRatio="xMidYMid slice" aria-label="Fronte: simbolo Abra con il filo che attraversa il biglietto">

  <path d="M945.0 368.1 L4000 -115.7" stroke="#F2BF2C" stroke-width="62" stroke-linecap="round" stroke-dasharray="150 160"/>

  <div class="metro-b" data-metro data-from="0" data-to="84" data-step="12" data-w="58" data-label="10"></div>

<div class="nota t-etichetta">Biglietto 85 x 55 mm, stampa a due colori più bianco. Il bordo del retro è un righello in millimetri, in scala reale. Numero di telefono segnaposto.</div>
