<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<title>Biglietto da visita Abra Robotics, fronte e retro (85 x 55 mm)</title>
<link rel="stylesheet" href="../assets/b.css">
<style>
/* scala di presentazione: 1 mm = 8 px. Per la stampa: 85 x 55 mm con 3 mm di abbondanza */
body{width:1600px;height:760px;background:#E6E0D4;display:flex;align-items:center;justify-content:center;gap:64px;position:relative}
.card{width:680px;height:440px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(36,33,30,.18),0 2px 4px rgba(36,33,30,.12)}
.fronte{background:var(--carta);padding:44px 48px}
.fronte img{height:46px}
.nome{position:absolute;left:48px;bottom:150px;font:400 38px/1.05 var(--serif);letter-spacing:-.015em}
.ruolo{position:absolute;left:48px;bottom:118px;font:italic 400 19px var(--serif);color:var(--grafite)}
.contatti{position:absolute;left:48px;right:48px;bottom:40px;display:flex;justify-content:space-between;font:500 16px/1.5 var(--sans);border-top:1.5px solid var(--inchiostro);padding-top:14px}
.contatti b{font-weight:600;display:block;font-size:12px;color:var(--grafite)}
.punto{position:absolute;right:48px;top:48px;width:22px;height:22px;border-radius:50%;background:var(--rosso)}
.retro{background:var(--rosso)}
.retro svg{position:absolute;inset:0}
.retro p{position:absolute;left:44px;bottom:42px;width:250px;font:italic 400 24px/1.2 var(--serif);color:var(--carta)}
.retro small{position:absolute;left:44px;top:40px;font:600 15px var(--sans);color:var(--carta)}
.didascalia{position:absolute;bottom:22px;left:0;right:0;text-align:center;font:500 13px var(--sans);color:var(--grafite)}
</style></head>
<body>
<div class="card fronte">
  <img src="../logo/orizzontale.svg" alt="Abra Robotics">
  <div class="nome">Niccolò Mazzoleni</div>
  <div class="ruolo">Cofondatore, commerciale e strategia</div>
  <div class="contatti"><span><b>Posta</b>nico@abrarobotics.com</span><span><b>Telefono</b>+39 000 000 0000</span><span><b>Sito</b>abrarobotics.com</span></div>
</div>
<div class="card retro">
  <svg viewBox="0 0 680 440" width="680" height="440" aria-hidden="true"><path fill="#E2A93B" d="M353.64 65.2A182.39999999999998 182.39999999999998 0 0 1 694 156.4L595.2 156.4A83.6 83.6 0 0 0 439.2 114.6Z"/><path fill="#F3EEE3" d="M352 291.3A146.29999999999998 146.29999999999998 0 1 1 644.6 291.3A146.29999999999998 146.29999999999998 0 1 1 352 291.3Z"/><path fill="#24211E" d="M595.2 156.4H694V440H595.2Z"/><path fill="#BB3B26" d="M595.2 181.69A146.29999999999998 146.29999999999998 0 0 1 644.6 291.3A146.29999999999998 146.29999999999998 0 0 1 595.2 400.91Z"/>
</svg>
  <small>abrarobotics.com</small>
  <p>Prova il robot sul tuo caso prima di investire.</p>
</div>
<p class="didascalia">Biglietto 85 x 55 mm, fronte su carta avorio non patinata, retro in rosso Abra. Telefono di esempio.</p>
</body></html>
